name: 龍飛陣 美股日線順勢驗證（IDEAS #143）

# 一次性研究：時間序列動量／200 日均線，yfinance 日線 2010 起；結果寫 GCS longfei/rulesim_oos/daily_trend_report.json。
# 只係紙上，唔落單。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  daily_trend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install
        run: pip install -q yfinance pandas google-cloud-storage
      - name: Daily trend check
        run: python3 research/longfei_rulesim/daily_trend_check.py

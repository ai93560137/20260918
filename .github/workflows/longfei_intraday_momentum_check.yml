name: 龍飛陣 美股日內動量驗證（IDEAS #142）

# 一次性研究：Gao 等 2018 日內動量（頭段回報預測尾段），yfinance 1 小時 K 線；結果寫 GCS longfei/rulesim_oos/intraday_momentum_report.json。
# 只係紙上，唔落單。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  intraday_momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install
        run: pip install -q yfinance pandas google-cloud-storage
      - name: Intraday momentum check
        run: python3 research/longfei_rulesim/intraday_momentum_check.py

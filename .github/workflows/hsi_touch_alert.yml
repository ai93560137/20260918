name: hsi-touch-alert
# 觸軌警報(恒指+黃金):每 15 分鐘比對延遲/即時報價與八陣圖通道
# (tradingview/data_external/levels.json 的前3日高低)。觸及上/下軌發 Telegram。
# 排程 workflow 必須在預設分支;腳本與數據在 claude/gifted-carson-v2tvhw,
# 故 checkout 該分支執行。警報有延遲,只作後備提醒,條件單以券商預掛為準。
# 黃金近 24 小時交易,故平日全日跑;週六 00:00-05:45 HKT 覆蓋紐約週五尾段。
# 恒指休市時段由腳本的報價呆滯檢查自動跳過。
on:
  schedule:
    - cron: '*/15 * * * 1-5'      # 平日全日(HKT=UTC+8):恒指日夜市+黃金
    - cron: '*/15 16-21 * * 5'    # (重疊無妨,GitHub 會去重同分鐘)
    - cron: '*/15 0-5 * * 6'      # 週六凌晨 HKT 08:00-13:45?否——UTC 0-5 = HKT 08:00-13:45 週六黃金已收;實為覆蓋紐約收市前 UTC Fri 16:00-21:00 已含於上行
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsi-touch-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check touch
        id: chk
        run: |
          pip install -q requests
          python .github/scripts/touch_alert.py
      - name: send alert + persist state
        if: steps.chk.outputs.alert == '1'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=$(cat .github/touch_alert_msg.txt)" > /dev/null
          git config user.name 'touch-alert-bot'
          git config user.email 'actions@github.com'
          git add .github/touch_alert_state.json
          git commit -m "alert: touch state $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase origin claude/gifted-carson-v2tvhw || true
          git push origin HEAD:claude/gifted-carson-v2tvhw

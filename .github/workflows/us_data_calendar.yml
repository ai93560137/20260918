name: 美國數據日曆（R348：數據前 4 小時唔開新倉）

# 抓 ForexFactory 本週＋下週 USD High，合併 ops/us_data_manual.json，寫 GCS ops/us_data_calendar.json。
# 龍飛陣 MHI 真倉、天覆陣 921／932 讀呢個檔。排程由 Cloud Scheduler zhuge-us-data-calendar 觸發（R267 唔用 GitHub cron）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印不寫 GCS（true/false）'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

concurrency:
  group: us-data-calendar
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT: sacred-alliance-453716-b7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install
        run: pip install -q -r scripts/requirements-agent.txt

      - name: Build calendar
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then ARGS="--dry-run"; fi
          python3 scripts/us_data_calendar.py $ARGS

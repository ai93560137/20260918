name: Full-market daily TEST（只跑新加坡；測完刪除）

# 設計：分支 claude/gifted-carson-v2tvhw 的 stock_research/FULLMARKET_DAILY_PIPELINE.md（使用者 2026-11-06 批准）。
# 由 Cloud Scheduler 觸發（ops/scheduler_jobs.json：stock-fullmarket-asia／americas／stock-forward-monthly）。
# 日線不進 git：每日整段重抓後覆寫 Release fullmarket-data（港日美）／oos-data（其餘）；
# 只 commit 名單 analysis/minervini/ 與紙上帳本 research/forward/ 到 claude/gifted-carson-v2tvhw。
# 不發 Telegram；不落單（紙上）。
on:
  push:
    branches: [claude/gifted-carson-v2tvhw]
    paths: ['.github/workflows/fullmarket_daily_test.yml']

permissions:
  contents: write

concurrency:
  group: fullmarket-daily-${{ inputs.group || 'sg' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.p.outputs.markets }}
    steps:
      - id: p
        env:
          G: ${{ inputs.group || 'sg' }}
        run: |
          case "$G" in
            asia) M='["hk","jp","tw","kr","au","in","sg"]' ;;
            americas) M='["us","ca"]' ;;
            monthly) M='[]' ;;
            hk|jp|us|tw|kr|au|ca|in|sg) M="[\"$G\"]" ;;
            *) echo "group 不合法：$G"; exit 1 ;;
          esac
          echo "markets=$M" >> "$GITHUB_OUTPUT"

  market:
    needs: plan
    if: needs.plan.outputs.markets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.markets) }}
    env:
      M: ${{ matrix.market }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q yfinance pandas numpy requests

      - name: Restore from Release（前一日的全市場日線）
        run: |
          case "$M" in hk|jp|us) TAG=fullmarket-data ;; *) TAG=oos-data ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" -p "$M.tar" -D /tmp
          tar -xf "/tmp/$M.tar"
          echo "還原 $(ls data_full/$M/*.csv.gz | wc -l) 檔"

      - name: Fetch（整段重抓；記錄本輪實際更新的檔數）
        id: fetch
        run: |
          START=$(date +%s)
          set +e
          python3 scripts/fetch_full_market.py --market "$M" --refresh-all --budget-min 110
          set -e
          python3 - "$M" "$START" <<'EOF' >> "$GITHUB_OUTPUT"
          import sys, pathlib
          m, start = sys.argv[1], float(sys.argv[2])
          d = pathlib.Path("data_full") / m
          pool = [l.strip() for l in pathlib.Path(f"universes/full/{m}_pool.txt").read_text(encoding="utf-8").splitlines()
                  if l.strip() and not l.startswith("#")]
          failed = set((d / "_failed.txt").read_text().split()) if (d / "_failed.txt").exists() else set()
          want = [t for t in pool if t not in failed]
          fresh = sum((d / f"{t.replace('^', '_')}.csv.gz").exists() and (d / f"{t.replace('^', '_')}.csv.gz").stat().st_mtime >= start
                      for t in want)
          ratio = fresh / max(len(want), 1)
          print(f"fresh={fresh}")
          print(f"want={len(want)}")
          print(f"done={'true' if ratio >= 0.95 else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Structural QC（重建排除檔；報告寫到暫存，不改已 commit 的 QC 報告）
        if: steps.fetch.outputs.done == 'true'
        continue-on-error: true
        run: python3 scripts/qc_full_market.py --market "$M" --no-network --report-dir /tmp/qc

      - name: Upload to Release（覆寫）
        if: steps.fetch.outputs.done == 'true'
        run: |
          tar -cf "/tmp/$M.tar" --exclude='_qc_exclude.txt' --exclude='_qc_zombie.json' "data_full/$M"
          ls -lh "/tmp/$M.tar"
          gh release upload "$TAG" "/tmp/$M.tar" --clobber

      - name: Minervini 名單＋紙上前向帳本
        if: steps.fetch.outputs.done == 'true'
        run: |
          python3 minervini_daily.py --market "$M"
          python3 forward_paper.py --market "$M"

      - name: 數據未齊的註記
        if: steps.fetch.outputs.done != 'true'
        run: echo "::warning::$M 本輪只更新 ${{ steps.fetch.outputs.fresh }}／${{ steps.fetch.outputs.want }} 檔（< 95%），今日不出名單、不更新帳本、不覆寫 Release"

      - name: Commit（只 add 本市場的檔）
        if: steps.fetch.outputs.done == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          add_out() { for f in analysis/minervini/*_"$M".csv research/forward/ledger_"$M".csv research/forward/ledger_"$M".asof; do [ -e "$f" ] && git add -- "$f"; done; true; }
          add_out
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "chore(minervini): $M 全市場名單＋紙上前向 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/gifted-carson-v2tvhw && exit 0
            sleep $((i * 7))
            git fetch origin claude/gifted-carson-v2tvhw
            git reset --mixed FETCH_HEAD
            add_out
            if git diff --cached --quiet; then echo "遠端已有相同內容"; exit 0; fi
            git commit -q -m "chore(minervini): $M 全市場名單＋紙上前向 $(date -u +%F)"
          done
          echo "push 重試 5 次仍失敗" && exit 1

  summary:
    needs: [plan, market]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q pandas numpy

      - name: 重建摘要（monthly 另出上月快照）
        env:
          G: ${{ inputs.group || 'sg' }}
        run: |
          if [ "$G" = "monthly" ]; then
            python3 forward_paper.py --monthly "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
          fi
          python3 forward_paper.py --summary

      - name: Commit
        env:
          G: ${{ inputs.group || 'sg' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          add_out() { for f in research/forward/README.md research/forward/20??-??.md; do [ -e "$f" ] && git add -- "$f"; done; true; }
          add_out
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "chore(forward): 紙上前向摘要（$G）$(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/gifted-carson-v2tvhw && exit 0
            sleep $((i * 7))
            git fetch origin claude/gifted-carson-v2tvhw
            git reset --mixed FETCH_HEAD
            if [ "$G" = "monthly" ]; then
              python3 forward_paper.py --monthly "$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
            fi
            python3 forward_paper.py --summary
            add_out
            if git diff --cached --quiet; then echo "遠端已有相同內容"; exit 0; fi
            git commit -q -m "chore(forward): 紙上前向摘要（$G）$(date -u +%F)"
          done
          echo "push 重試 5 次仍失敗" && exit 1

name: fetch-vhsi
# 資料下載器：開發環境無對外網路，借 Actions 執行器抓 VHSI（恒指波指）。
# 只跑 repo 內的 .github/scripts/fetch_vhsi.py，僅安裝 PyPI 主流套件。
on:
  push:
    paths: ['.github/workflows/fetch-vhsi.yml', '.github/scripts/fetch_vhsi.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch data
        run: |
          pip -q install yfinance pandas requests
          python .github/scripts/fetch_vhsi.py
      - name: commit data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tradingview/data_external/
          git diff --cached --quiet || git commit -m "data: VHSI 抓取結果（Actions 自動）"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

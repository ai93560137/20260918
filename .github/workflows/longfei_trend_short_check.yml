name: 龍飛陣 日線跌勢沽空驗證（IDEAS #132）

# 一次性研究：yfinance 1 小時 K 線（約 730 日）驗使用者「日線跌勢＋當日向下沽空」，結果寫 GCS longfei/rulesim_oos/trend_short_report.json。
# 只係紙上，唔落單。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  trend_short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install
        run: pip install -q yfinance pandas google-cloud-storage
      - name: Trend short check
        run: python3 research/longfei_rulesim/trend_short_check.py

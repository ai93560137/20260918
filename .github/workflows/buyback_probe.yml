name: Buyback data probe（回購公告來源探測）

# 一次性探測各市場回購公告的查詢端點，原始回應存 data/buyback/probe/。探測完成後刪除此 workflow。
on:
  workflow_dispatch:
  push:  # 開發用
    branches: [claude/pelosi-stock-tracking-f9f94g]
    paths: [scripts/buyback_probe.py, .github/workflows/buyback_probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Probe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -u scripts/buyback_probe.py
      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buyback/probe
          git diff --cached --quiet && exit 0
          git commit -q -m "chore(buyback): 回購公告來源探測 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5)); git pull --rebase origin "$BRANCH" || exit 1
          done
          exit 1

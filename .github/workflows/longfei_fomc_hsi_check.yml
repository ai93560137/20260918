name: 龍飛陣 FOMC 事件日對恒指影響（IDEAS #144）

# 一次性研究：^HSI 日線 2020 起 × 聯儲局公佈日；結果寫 GCS longfei/rulesim_oos/fomc_hsi_report.json。
# 只係紙上，唔落單。
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fomc_hsi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Install
        run: pip install -q yfinance pandas google-cloud-storage
      - name: FOMC HSI check
        run: python3 research/longfei_rulesim/fomc_hsi_check.py

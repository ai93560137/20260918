name: Fetch stock data

on:
  schedule:
    # 17:00 HKT（09:00 UTC）：港股收盤後
    - cron: '0 9 * * 1-5'
    # 05:30 HKT 次日（21:30 UTC 前一日）：美股收盤後
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch HK + US universes
        run: python3 scripts/fetch_stock_data.py scripts/universe_hk.txt scripts/universe_us.txt scripts/pool_hsi_full.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): 自動更新股票日線數據 $(date -u +%Y-%m-%d)"
            git push origin HEAD:claude/gifted-carson-v2tvhw
          fi

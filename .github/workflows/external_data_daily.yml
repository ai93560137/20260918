name: External data daily（外部來源每日彙整）

# 每天把三個外部來源收進本分支的 data/external/，其他分支都從這裡取：
#   MT5  ← Cloud Run ?view=archive（main.py R95 按日封存的 M1）
#   Futu ← Cloud Run ?view=archive（本地 push_to_gcp.py 推上來的 K 線與期權 IV）
#   IBKR ← 雲垂分支 claude/dazzling-curie-f3xzb8（GCP VM 推回的 IV 與股票收市）
# 腳本見 scripts/external_data_sync.py，狀態見 data/external/STATUS.md。
# 同步完接著跑 scripts/external_qc.py：Futu／IBKR 對照各分支的網站數據，逐欄逐日期比對，
# 報告與閘門在 data/external/qc/（QC_REPORT.md、GATE.json），並產生明天給 Futu 的日線抽樣清單。
# 需要 GitHub Secret：ZHUGE_GCP_URL（Cloud Run 網址，結尾斜線可有可無）。沒設就只同步 IBKR。
# 00:17 UTC（香港 08:17）：美股收市、MT5 券商換日（21:00 UTC）之後，也等鳥翔的網站日線
# （gifted-carson 約 22:58–23:56 UTC 提交）更新完，當天的數據當天比得到；在港股開市前完成。
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '重拉最近幾天（預設 10；補漏可填 30）'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: external-data-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch IBKR source branch（雲垂）
        continue-on-error: true   # 拿不到就只同步 GCP，STATUS.md 會寫明
        run: git fetch --depth=1 origin "claude/dazzling-curie-f3xzb8:refs/remotes/origin/claude/dazzling-curie-f3xzb8"

      - name: Fetch web-data branches for QC（鳥翔網站日線、金絲雀）
        continue-on-error: true   # 拿不到的類別在 QC 報告裡會是 NO_DATA
        run: |
          # blob:none：只抓目錄結構，比對讀到哪個檔才下載哪個（網站日線分支整包 400 MB）
          for B in claude/gifted-carson-v2tvhw claude/canary-playbook-final-3um9lp; do
            git fetch --depth=1 --filter=blob:none origin "$B:refs/remotes/origin/$B"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q requests

      - name: Sync external sources
        env:
          ZHUGE_GCP_URL: ${{ secrets.ZHUGE_GCP_URL }}
          EXTERNAL_DAYS: ${{ inputs.days || '10' }}
        run: |
          [ -z "$ZHUGE_GCP_URL" ] && echo "::warning::GitHub Secret ZHUGE_GCP_URL 沒設，MT5／Futu 不會同步"
          python3 scripts/external_data_sync.py

      - name: Cross-source QC（抽樣比對）
        continue-on-error: true   # 比對程式出錯不擋數據提交；比對結果 FAIL 不是程式錯誤
        run: python3 scripts/external_qc.py

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          add_out() { git add data/external; true; }
          add_out
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "chore(external): 外部來源每日彙整 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin "$BRANCH" || { git rebase --abort; git fetch origin "$BRANCH"; git reset --mixed FETCH_HEAD; add_out; git commit -q -m "chore(external): 外部來源每日彙整 $(date -u +%F)" || exit 0; }
          done
          echo "push 重試 5 次仍失敗" && exit 1

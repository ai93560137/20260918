name: Research HSI constituent history

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch candidate sources
        run: python3 scripts/research_hsi_history.py

      - name: Commit research output if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_output/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(research): HSI 成分股歷史來源探勘輸出"
            git push origin HEAD:claude/gifted-carson-v2tvhw
          fi

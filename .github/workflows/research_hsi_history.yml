name: Research HSI constituent history

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch candidate sources
        run: python3 scripts/research_hsi_history.py

      - uses: actions/upload-artifact@v4
        with:
          name: hsi-history-research
          path: research_output/
          retention-days: 7

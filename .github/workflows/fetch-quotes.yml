name: fetch-quotes
# 定時抓 HKEX 延遲行情（恒指期貨+期權鏈）。只跑 repo 內腳本、只裝 PyPI 套件。
on:
  workflow_dispatch:
  push:
    paths: ['.github/scripts/fetch_hkex_quotes.py', '.github/trigger-scan']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch and scan
        run: |
          pip -q install requests pandas numpy
          python .github/scripts/fetch_hkex_quotes.py
          cd tradingview && python hsi_scan.py
      - name: telegram notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -s tradingview/data_external/alert.txt ] && [ -n "$TG_BOT_TOKEN" ]; then
            if [ -z "$TG_CHAT_ID" ]; then
              TG_CHAT_ID=$(curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates" | jq -r '[.result[].message.chat.id] | first // empty')
              echo "auto-detected chat_id: ${TG_CHAT_ID:-NONE - give the bot a message first}"
            fi
            if [ -n "$TG_CHAT_ID" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=$(cat tradingview/data_external/alert.txt)" > /dev/null
              echo "telegram sent"
            fi
          else
            echo "no alert or no token - skip"
          fi
      - name: commit data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tradingview/data_external/
          git diff --cached --quiet || git commit -m "data: HKEX 行情快照（Actions 自動）"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

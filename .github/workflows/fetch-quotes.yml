name: fetch-quotes
# 定時抓 HKEX 延遲行情（恒指期貨+期權鏈）。只跑 repo 內腳本、只裝 PyPI 套件。
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'send daily digest to telegram (false = alerts only)'
        default: 'true'
  push:
    paths: ['.github/scripts/fetch_hkex_quotes.py', '.github/trigger-scan']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch and scan
        run: |
          pip -q install requests pandas numpy yfinance
          python .github/scripts/fetch_us_daily.py || echo "us daily refresh failed - scan uses last snapshot"
          python .github/scripts/fetch_spx_chain.py || echo "spx chain fetch failed - non-fatal"
          python .github/scripts/fetch_hkex_quotes.py
          python .github/scripts/fetch_hsiw_weekly.py || echo "hsiw weekly iv log failed - non-fatal"
          cd tradingview && python hsi_scan.py
      - name: telegram notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WANT_DIGEST: ${{ inputs.digest || 'true' }}
        run: |
          # 有警報發警報；否則按 digest 開關發每日摘要（兩市場全報告）
          MSG=""
          if [ -s tradingview/data_external/alert.txt ]; then
            MSG=tradingview/data_external/alert.txt
          elif [ "$WANT_DIGEST" != "false" ] && [ -s tradingview/data_external/digest.txt ]; then
            MSG=tradingview/data_external/digest.txt
          fi
          if [ -n "$MSG" ] && [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=$(cat $MSG)" > /dev/null
            echo "telegram sent: $MSG"
          else
            echo "nothing to send or no token - skip"
          fi
      - name: commit data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tradingview/data_external/
          git diff --cached --quiet || git commit -m "data: HKEX 行情快照（Actions 自動）"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Fetch equities (US / JP)

# 美股/日股日線（v2 純文字分年格式，見 marketdata.py / scripts/fetch_equities.py）。
# 港股仍由 fetch_stock_data.yml 負責（舊格式，遷移待定）。
on:
  schedule:
    # 美股收市後：06:30 HKT（22:30 UTC，夏令/冬令都已收市）
    - cron: '30 22 * * 1-5'
    # 日股收市後：16:30 JST（07:30 UTC）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      market:
        description: 'us 或 jp'
        required: true
        default: 'us'
      shares:
        description: '順便抓流通股數歷史（慢；排程只在週一抓）'
        required: false
        default: 'false'
      digest:
        description: '手動觸發時是否發 Telegram 日報（有 🔴 警報一律照發）'
        required: false
        default: 'false'
      xcheck_min:
        description: '全量歷史比對的時間上限（分鐘；空白 = 美股 15、日股 60）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-equities-${{ inputs.market || github.event.schedule }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gifted-carson-v2tvhw

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Decide market
        id: m
        env:
          IN_MARKET: ${{ inputs.market }}
          CRON: ${{ github.event.schedule }}
          IN_SHARES: ${{ inputs.shares }}
        run: |
          if [ -n "$IN_MARKET" ]; then M="$IN_MARKET"
          elif [ "$CRON" = "30 7 * * 1-5" ]; then M=jp
          else M=us; fi
          if [[ ! "$M" =~ ^(us|jp)$ ]]; then echo "market 只能是 us/jp：$M"; exit 1; fi
          echo "market=$M" >> "$GITHUB_OUTPUT"
          if [ "$IN_SHARES" = "true" ] || [ "$(date -u +%u)" = "1" ]; then echo "shares=--shares" >> "$GITHUB_OUTPUT"; fi
          # yfinance 公司名/行業：週一或還沒有名字檔時才抓（每天的改名偵測靠第二來源名字）
          if [ "$(date -u +%u)" = "1" ] || [ ! -f "data/equities/$M/_names.json" ]; then echo "names=--fetch-names" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch prices (yfinance)
        continue-on-error: true
        timeout-minutes: 75
        run: python3 scripts/fetch_equities.py ${{ steps.m.outputs.shares }} --budget-min 70 universes/${{ steps.m.outputs.market }}/fetch_list.txt

      # 第二來源與品質報告是輔助，各自設時間上限，絕不能拖住主數據的 commit
      - name: Second source（美股 Nasdaq.com / 日股 Yahoo!ファイナンス + JPX）
        continue-on-error: true
        timeout-minutes: 12
        run: python3 scripts/fetch_second_source.py --market ${{ steps.m.outputs.market }}

      # 全量歷史比對：第二來源整段歷史逐筆比，分批推進（進度存 _xcheck.json），全部比完自動輪回
      - name: Full history cross-check（全量歷史比對）
        continue-on-error: true
        timeout-minutes: 130
        env:
          M: ${{ steps.m.outputs.market }}
          XMIN: ${{ inputs.xcheck_min }}
        run: |
          if [[ ! "$XMIN" =~ ^[0-9]*$ ]]; then echo "xcheck_min 只能是數字"; exit 1; fi
          if [ -z "$XMIN" ]; then if [ "$M" = "jp" ]; then XMIN=60; else XMIN=15; fi; fi
          python3 scripts/xcheck_history.py --market "$M" --budget-min "$XMIN"

      - name: Data quality check
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/check_equities_quality.py --market ${{ steps.m.outputs.market }} --fetch-missing-names ${{ steps.m.outputs.names }}

      - name: Commit and push if changed
        env:
          M: ${{ steps.m.outputs.market }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          add_data() { for d in "data/equities/$M"; do [ -e "$d" ] && git add --ignore-removal "$d"; done; }
          add_data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -q -m "chore(data): 自動更新 $M 日線 $(date -u +%Y-%m-%d)"
          # 純文字檔、只 add 本市場目錄：被拒就把 HEAD 指到最新遠端、重新 add 本輪檔案再 commit
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/gifted-carson-v2tvhw && exit 0
            sleep $((i * 5))
            git fetch origin claude/gifted-carson-v2tvhw
            git reset --mixed FETCH_HEAD
            add_data
            if git diff --cached --quiet; then
              echo "遠端已有相同數據"
              exit 0
            fi
            git commit -q -m "chore(data): 自動更新 $M 日線 $(date -u +%Y-%m-%d)"
          done
          echo "push 重試 5 次仍失敗" && exit 1

      # Telegram 通道一（同港股 fetch_stock_data.yml）：有 🔴 發警報（任何觸發都發）；
      # 否則排程輪發日報、手動觸發預設靜默（digest=true 才發）。curl --fail：拒收時這步會紅
      - name: Telegram notify（警報優先，日報兜底）
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          M: ${{ steps.m.outputs.market }}
          EVENT: ${{ github.event_name }}
          WANT_DIGEST: ${{ inputs.digest }}
        run: |
          MSG=""
          if [ -s "data/equities/$M/qc_alert.txt" ]; then
            MSG="data/equities/$M/qc_alert.txt"
          elif [ "$EVENT" = "schedule" ] || [ "$WANT_DIGEST" = "true" ]; then
            if [ -s "data/equities/$M/qc_digest.txt" ]; then MSG="data/equities/$M/qc_digest.txt"; fi
          fi
          if [ -z "$MSG" ]; then echo "nothing to send - skip"; exit 0; fi
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TG_BOT_TOKEN / TG_CHAT_ID 沒設，未發送 $MSG"; exit 0
          fi
          curl -sS --fail -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=$(cat "$MSG")" > /dev/null
          echo "telegram sent: $MSG"

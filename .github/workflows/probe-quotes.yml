name: probe-quotes
# 一次性:探測免費報價源的瀏覽器跨域可用性(結果看 run log),用完即刪。
on:
  push:
    paths: ['.github/scripts/probe_quotes.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -q requests
          python .github/scripts/probe_quotes.py

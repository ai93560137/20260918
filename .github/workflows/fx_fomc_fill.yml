name: FX FOMC M1 fill（Dukascopy 補抓缺價日）

# FOMC 漂移回測（forex_research/FX_FOMC_DRIFT_BACKTEST.md）：HistData 2023-02→07 缺奇數小時等缺價日，用 Dukascopy M1 bid 補抓進 data_forex_rates/fomc/m1_fill/。
on:
  workflow_dispatch:
    inputs:
      days:
        description: '要補的 UTC 日（空白分隔）'
        required: false
        default: '2003-08-08 2003-08-12 2004-03-12 2004-03-16 2023-03-20 2023-03-22 2023-05-01 2023-05-03 2023-06-12 2023-06-14 2023-07-24 2023-07-26'
  push:
    branches: [claude/forex-data-testing-w4q3m2]
    paths: ['.github/workflows/fx_fomc_fill.yml', 'scripts/fomc_m1_fill.py']

permissions:
  contents: write

concurrency:
  group: fx-fomc-fill
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forex-data-testing-w4q3m2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pandas numpy
      - name: Fill
        run: python3 scripts/fomc_m1_fill.py --days ${{ inputs.days || '2003-08-08 2003-08-12 2004-03-12 2004-03-16 2023-03-20 2023-03-22 2023-05-01 2023-05-03 2023-06-12 2023-06-14 2023-07-24 2023-07-26' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_forex_rates/fomc/m1_fill
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "data(fomc): Dukascopy M1 補抓缺價日 $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:claude/forex-data-testing-w4q3m2 && exit 0
            sleep $((i * 7)); git fetch origin claude/forex-data-testing-w4q3m2; git reset --mixed FETCH_HEAD
            git add data_forex_rates/fomc/m1_fill; git diff --cached --quiet && exit 0
            git commit -q -m "data(fomc): Dukascopy M1 補抓缺價日 $(date -u +%F)"
          done
          exit 1

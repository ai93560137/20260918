<script language="javascript">		
		function isPosInteger(inputVal) {
			inputStr = inputVal.toString()
			for (var i = 0; i < inputStr.length; i++) {
				var oneChar = inputStr.charAt(i)
				if (oneChar < "0" || oneChar > "9") {
					return false
				}
			}
			return true
		}	
		
		function CheckAll(form)	{
			var cbbccode = form.txtCBBCCode.value;
			var fromdate = form.txtFromDate.value;
			var todate = form.txtToDate.value;
			var year;
			var month;
			var day;
			
			if (cbbccode == "") {
				alert("Invalid CBBC Code, please try again.");
				form.txtCBBCCode.focus();
				return(false);
			}
			
			if (!isPosInteger(cbbccode)) {
				alert("Invalid CBBC Code, please try again.");
				form.txtCBBCCode.focus();
				return(false);
			}
			
			if (fromdate.length != 8) {
				alert("Invalid date, please try again.");
				form.txtFromDate.focus();
				return(false);
			}
			
			if (todate.length != 8) {
				alert("Invalid date, please try again.");
				form.txtToDate.focus();
				return(false);
			}
			
			if (fromdate != "") {
				day = parseInt(fromdate.substring(0,2), 10);
				month = parseInt(fromdate.substring(2,4), 10);
				year = parseInt(fromdate.substring(4,8), 10);
				
				if (!(day >= 1 && day <= 31)) {
					alert("Invalid date, please try again.");
					form.txtFromDate.focus();
					return(false);
				}
				if (!(month >= 1 && month <= 12)) {
					alert("Invalid date, please try again.");
					form.txtFromDate.focus();
					return(false);
				}
				if (!(year >= 2016 && year <= 2026)) {
					alert("Invalid date, please try again.");
					form.txtFromDate.focus();
					return(false);
				}
				
				fromdate = fromdate.substring(4,8) + fromdate.substring(2,4) + fromdate.substring(0,2);

				if (fromdate < "20251011")
				{
					alert("Invalid date, please try again.");
					form.txtFromDate.focus();
					return(false);
				}
			}

			if (todate != "") {			
				day = parseInt(todate.substring(0,2), 10);
				month = parseInt(todate.substring(2,4), 10);
				year = parseInt(todate.substring(4,8), 10);
				
				if (!(day >= 1 && day <= 31)) {
					alert("Invalid date, please try again.");
					form.txtToDate.focus();
					return(false);
				}
				if (!(month >= 1 && month <= 12)) {
					alert("Invalid date, please try again.");
					form.txtToDate.focus();
					return(false);
				}
				if (!(year >= 2025 && year <= 2027)) {
					alert("Invalid date, please try again.");
					form.txtToDate.focus();
					return(false);
				}
				
				todate = todate.substring(4,8) + todate.substring(2,4) + todate.substring(0,2);
				
				if (todate > "20261011")
				{
					alert("Invalid date, please try again.");
					form.txtToDate.focus();
					return(false);
				}		
			}

			if (fromdate > todate)
			{
				alert("Invalid date, please try again.");
				form.txtFromDate.focus();
				return(false);
			}					
					
			return(true);
		}
			
		function openWin(url, name) {
			var win;
			win = window.open(url, name)

			if (win.focus != null)
				win.focus();
		}
</script>

<script type="text/javascript">
    function isPosInteger(inputVal) {
        inputStr = inputVal.toString()
        for (var i = 0; i < inputStr.length; i++) {
            var oneChar = inputStr.charAt(i)
            if (oneChar < "0" || oneChar > "9") {
                return false
            }
        }
        return true
    }

    function isNumber(inputVal) {
        inputStr = inputVal.toString()
        for (var i = 0; i < inputStr.length; i++) {
            var oneChar = inputStr.charAt(i)
            if (inputStr.length == 1 && oneChar == "-")
                return false

            if (i != 0 && oneChar == "-")
                return false

            if (!(oneChar == "-" || oneChar == "." || oneChar == "0" || oneChar == "1" || oneChar == "2" || oneChar == "3" || oneChar == "4" || oneChar == "5" || oneChar == "6" || oneChar == "7" || oneChar == "8" || oneChar == "9")) {
                return false
            }
        }
        return true
    }

    function CheckAll(form) {
        var iwcode = form.txtIWCode.value;
        var issuer = form.lstIssuer.options[form.lstIssuer.selectedIndex].value;
        var underlying = form.lstUnderlying.options[form.lstUnderlying.selectedIndex].value;
        var listing = form.lstListingDate.options[form.lstListingDate.selectedIndex].value;
        var maturity = form.lstMaturityDate.options[form.lstMaturityDate.selectedIndex].value;
        var fromstrike = form.txtFromStrike.value;
        var tostrike = form.txtToStrike.value;
        var fromdelta = form.txtFromDelta.value;
        var todelta = form.txtToDelta.value;
        var fromimpvol = form.txtFromImplVol.value;
        var toimpvol = form.txtToImplVol.value;
        var fromoutst = form.txtFromOutstanding.value;
        var tooutst = form.txtToOutstanding.value;

        if (!isPosInteger(iwcode)) {
            alert("權證代號無效, 請重新輸入.");
            form.txtIWCode.focus();
            return (false);
        }

        if (iwcode == "") {

            if (issuer == "" && underlying == "") {
                alert("請輸入權證代號或選擇發行商或正股.");
                form.txtIWCode.focus();
                return (false);
            }

            if (!isNumber(fromstrike)) {
                alert("數值無效, 請重新輸入下限價和上限價.");
                form.txtFromStrike.focus();
                return (false);
            }

            if (!isNumber(tostrike)) {
                alert("數值無效, 請重新輸入下限價和上限價.");
                form.txtToStrike.focus();
                return (false);
            }

            if (!isNumber(fromdelta)) {
                alert("數值無效, 請重新輸入對沖值.");
                form.txtFromDelta.focus();
                return (false);
            }

            if (!isNumber(todelta)) {
                alert("數值無效, 請重新輸入對沖值.");
                form.txtToDelta.focus();
                return (false);
            }

            if (!isNumber(fromimpvol)) {
                alert("數值無效, 請重新輸入引申波幅.");
                form.txtFromImplVol.focus();
                return (false);
            }

            if (!isNumber(toimpvol)) {
                alert("數值無效, 請重新輸入引申波幅.");
                form.txtToImplVol.focus();
                return (false);
            }

            if (!isNumber(fromoutst)) {
                alert("數值無效, 請重新輸入街貨量所佔百分比.");
                form.txtFromOutstanding.focus();
                return (false);
            }

            if (!isNumber(tooutst)) {
                alert("數值無效, 請重新輸入街貨量所佔百分比.");
                form.txtToOutstanding.focus();
                return (false);
            }

            if ((listing != "" || maturity != "" || fromoutst != "" || tooutst != "") && (issuer == "" && underlying == "")) {
                alert("請選擇發行商或正股.");
                form.lstIssuer.focus();
                return (false);
            }

            if ((fromstrike != "" || tostrike != "" || fromdelta != "" || todelta != "" || fromimpvol != "" || toimpvol != "") && (underlying == "")) {
                alert("請選擇正股.");
                form.lstUnderlying.focus();
                return (false);
            }

            if (fromstrike != "" && tostrike != "") {
                if (parseFloat(fromstrike) > parseFloat(tostrike)) {
                    alert("數值無效 - 下限價和上限價.");
                    form.txtFromStrike.focus();
                    return (false);
                }
            }

            if (fromdelta != "" && todelta != "") {
                if (parseFloat(fromdelta) > parseFloat(todelta)) {
                    alert("數值無效 - 對沖值.");
                    form.txtFromDelta.focus();
                    return (false);
                }
            }

            if (fromimpvol != "" && toimpvol != "") {
                if (parseFloat(fromimpvol) > parseFloat(toimpvol)) {
                    alert("數值無效 - 引申波幅.");
                    form.txtFromImplVol.focus();
                    return (false);
                }
            }

            if (fromoutst != "" && tooutst != "") {
                if (parseFloat(fromoutst) > parseFloat(tooutst)) {
                    alert("數值無效 - 街貨量所佔百分比.");
                    form.txtFromOutstanding.focus();
                    return (false);
                }
            }
        }

        return (true);
    }
</script>
